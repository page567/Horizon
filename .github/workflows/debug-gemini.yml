name: Debug Gemini
on:
  workflow_dispatch
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-genai httpx
      - run: python debug_gemini.py
