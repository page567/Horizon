name: Debug Models 2
on:
  workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openai httpx
      - run: python debug_models.py
